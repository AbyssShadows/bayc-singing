schema_version = "1.0.0"

id = "ape_synth"
version = "1.2.0"
name = "Ape Synth"
tagline = "Make your 3D ape sing and fart any song, X-ray organs included"
maintainer = "AbyssShadows"
type = "add-on"
website = "https://github.com/AbyssShadows/ape-synth"
tags = ["Animation", "Rigging", "Render"]

blender_version_min = "5.2.0"

license = ["SPDX:MIT"]
copyright = [
  "2026 AbyssShadows",
  "2026 Jameson Hodge (chimera-vocal-synth, bundled as bin/)",
]

[permissions]
files = "Read songs and MIDI files, write audio, scenes and videos"

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc", ".*"]
